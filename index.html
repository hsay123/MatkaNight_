<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>matkanight</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript style="min-height:100vh;background:#0B0B14;color:#D1D1E0;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
        <p>MatkaNight requires JavaScript to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
